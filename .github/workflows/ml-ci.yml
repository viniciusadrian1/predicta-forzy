name: ML CI

# Pipelines de ML sao implementados a partir da Sprint 3; este workflow ja
# valida a sintaxe de qualquer codigo adicionado a pasta ml/.

on:
  push:
    paths:
      - "ml/**"
      - ".github/workflows/ml-ci.yml"
  pull_request:
    paths:
      - "ml/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate ML Python sources
        run: python -m compileall -q ml
