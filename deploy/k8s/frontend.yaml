# Frontend Predicta (Next.js 14).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: predicta
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: predicta/frontend:0.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: 256Mi }
            limits: { cpu: "500m", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: predicta
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
