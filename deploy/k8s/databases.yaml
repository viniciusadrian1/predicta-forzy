  namespace: predicta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: "100m", memory: 64Mi }
            limits: { cpu: "500m", memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: predicta
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
