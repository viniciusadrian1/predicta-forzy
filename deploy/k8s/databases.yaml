# ------------------------------------------------------- Simulador OPC-UA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opcua-simulator
  namespace: predicta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opcua-simulator
  template:
    metadata:
      labels:
        app: opcua-simulator
    spec:
      containers:
        - name: opcua-simulator
          image: predicta/opcua-simulator:0.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4840
          env:
            - name: OPCUA_HOST
              value: "0.0.0.0"
            - name: OPCUA_PORT
              value: "4840"
          resources:
            requests: { cpu: "100m", memory: 128Mi }
            limits: { cpu: "500m", memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: opcua-simulator
  namespace: predicta
spec:
  selector:
    app: opcua-simulator
  ports:
    - port: 4840
      targetPort: 4840
