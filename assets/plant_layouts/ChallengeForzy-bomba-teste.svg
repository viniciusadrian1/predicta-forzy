<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="sans-serif">
  <!-- Planta baixa esquematica - Sala de Bombas (ver ADR 0004) -->
  <rect width="1000" height="640" fill="#0f172a"/>

  <!-- grade de piso -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="0" y1="80" x2="1000" y2="80"/>
    <line x1="0" y1="160" x2="1000" y2="160"/>
    <line x1="0" y1="240" x2="1000" y2="240"/>
    <line x1="0" y1="320" x2="1000" y2="320"/>
    <line x1="0" y1="400" x2="1000" y2="400"/>
    <line x1="0" y1="480" x2="1000" y2="480"/>
    <line x1="0" y1="560" x2="1000" y2="560"/>
    <line x1="160" y1="0" x2="160" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/>
  </g>

  <!-- paredes externas -->
  <rect x="40" y="70" width="920" height="520" fill="none" stroke="#64748b" stroke-width="6"/>

  <!-- divisoria: Sala Eletrica (canto superior direito) -->
  <line x1="700" y1="70" x2="700" y2="320" stroke="#64748b" stroke-width="5"/>
  <line x1="700" y1="320" x2="960" y2="320" stroke="#64748b" stroke-width="5"/>
  <!-- porta da sala eletrica -->
  <line x1="700" y1="180" x2="700" y2="240" stroke="#0f172a" stroke-width="7"/>

  <!-- titulos -->
  <text x="60" y="55" fill="#cbd5e1" font-size="20" font-weight="bold">PLANTA SAO PAULO</text>
  <text x="70" y="110" fill="#64748b" font-size="16">Sala de Bombas</text>
  <text x="730" y="110" fill="#64748b" font-size="16">Sala Eletrica</text>

  <!-- reservatorio de agua -->
  <g>
    <rect x="110" y="380" width="150" height="150" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/>
    <path d="M110 430 q37 -20 75 0 q37 20 75 0" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <text x="185" y="555" fill="#94a3b8" font-size="13" text-anchor="middle">Reservatorio</text>
  </g>

  <!-- skid: bomba + motor (area do MTR-001) -->
  <g>
    <rect x="380" y="210" width="260" height="150" rx="8" fill="#152033" stroke="#475569" stroke-width="2"/>
    <text x="510" y="345" fill="#64748b" font-size="13" text-anchor="middle">Skid - Bomba de Teste</text>
    <!-- bomba (voluta) -->
    <circle cx="430" cy="270" r="34" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="430" cy="270" r="12" fill="#475569"/>
    <!-- motor MTR-001 -->
    <rect x="478" y="244" width="120" height="54" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/>
    <g stroke="#475569" stroke-width="3">
      <line x1="490" y1="244" x2="490" y2="298"/>
      <line x1="506" y1="244" x2="506" y2="298"/>
      <line x1="522" y1="244" x2="522" y2="298"/>
      <line x1="538" y1="244" x2="538" y2="298"/>
      <line x1="554" y1="244" x2="554" y2="298"/>
      <line x1="570" y1="244" x2="570" y2="298"/>
    </g>
    <!-- eixo bomba-motor -->
    <line x1="464" y1="271" x2="478" y2="271" stroke="#94a3b8" stroke-width="4"/>
  </g>

  <!-- tubulacao reservatorio -> bomba -->
  <path d="M185 380 L185 300 L396 300 L396 282" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="2 4"/>

  <!-- painel eletrico (QGBT) na sala eletrica -->
  <g>
    <rect x="800" y="120" width="110" height="150" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/>
    <line x1="855" y1="120" x2="855" y2="270" stroke="#475569" stroke-width="2"/>
    <text x="855" y="295" fill="#94a3b8" font-size="13" text-anchor="middle">QGBT</text>
  </g>
</svg>
