# Render Blueprint — Predicta (site de testes do grupo).
#
# Cria 2 servicos num deploy so:
#   - predicta-forzy-backend   -> FastAPI (Docker) + workers
#   - predicta-forzy-frontend  -> Next.js
#
# BANCO: usa um Postgres EXTERNO gratuito (Neon ou Supabase) via DATABASE_URL,
# porque o free tier do Render permite apenas UM banco gerenciado por conta (ja
# em uso pelo DeliveryHub). Cole a connection string no env var DATABASE_URL do
# backend (marcado sync:false abaixo) no 1o deploy.
#
# TimescaleDB e OPCIONAL: Neon/Supabase nao tem a extensao, entao o backend cai
# automaticamente para "Postgres simples" (as tabelas de telemetria funcionam
# como tabelas comuns). O mesmo banco serve catalogo + telemetria.
#
# IMPORTANTE (ajustar se o Render mudar os nomes/URLs):
#   As URLs cruzadas (CORS_ORIGINS e NEXT_PUBLIC_API_URL) assumem os nomes de
#   servico abaixo. Se o Render adicionar um sufixo aleatorio (nome ja em uso),
#   corrija as duas variaveis no dashboard depois do 1o deploy.

services:
  # ----------------------- Backend (FastAPI / Docker) -----------------------
  - type: web
    name: predicta-forzy-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    # Free tier nao permite preDeployCommand: rodamos migracoes + seed
    # (idempotentes) no proprio start e subimos o uvicorn na porta do Render.
    dockerCommand: 'sh -c "alembic upgrade head && python -m app.scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT"'
    envVars:
      # Mantem o login-demo do grupo (o guard de producao NAO dispara em development).
      - key: ENVIRONMENT
        value: development
      - key: LOG_LEVEL
        value: INFO
      - key: RAG_VECTOR_BACKEND
        value: memory
      - key: EXTERNAL_SENSORS_BASE_URL
        value: ""
      # Origem do frontend (CORS). Ajuste se a URL do front for outra.
      - key: CORS_ORIGINS
        value: https://predicta-forzy-frontend.onrender.com
      # --- Banco externo unico (Neon/Supabase) -> catalogo + telemetria ---
      # Cole a connection string aqui no dashboard (Render nao a versiona).
      # Formato: postgresql://user:pass@host/db  (o codigo adiciona SSL + asyncpg)
      - key: DATABASE_URL
        sync: false

  # ----------------------- Frontend (Next.js nativo) -----------------------
  - type: web
    name: predicta-forzy-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx next start -H 0.0.0.0 -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      # URL publica do backend (fica "assada" no build do Next). Ajuste se a
      # URL do backend for outra.
      - key: NEXT_PUBLIC_API_URL
        value: https://predicta-forzy-backend.onrender.com
