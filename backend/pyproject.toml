[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forzy-backend"
version = "0.1.0"
description = "Predicta - API / BFF"
requires-python = ">=3.11"
dependencies = [
    # fastapi <0.116 fixa o Starlette na serie 0.4x; o Starlette 1.x quebra a
    # introspecao de rotas do prometheus-fastapi-instrumentator (_IncludedRouter).
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "asyncua>=1.1.0,<2.0",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.12",
    "prometheus-fastapi-instrumentator>=7.0,<8",
    "pillow>=11.0",
    "reportlab>=4.2",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "httpx>=0.27",
    "pypdf>=5.0",
]

[project.optional-dependencies]
ocr = ["paddleocr>=2.7"]
rag = ["chromadb>=0.5"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "aiosqlite>=0.20",
    "ruff>=0.8",
    "black>=24.10",
    "mypy>=1.14",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E402"]
"tests/*" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
omit = ["app/scripts/*", "*/__init__.py", "app/main.py"]
